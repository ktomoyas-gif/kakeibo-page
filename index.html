<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シンプルな家計簿アプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <h1 class="page-header">家計簿</h1>
      <h2>家計簿をつけましょう</h2>

      <div class="dashboard">
        <section class="panel">
          <h2>家計簿を登録</h2>
          <form class="form-grid">
            <div class="field">
              <label for="date">日付</label>
              <input type="date" id="date" name="date" />
            </div>

            <div class="field">
              <label for="item">品目</label>
              <input type="text" id="item" name="item" placeholder="例: 食費" />
            </div>

            <div class="field">
              <label for="type">分類</label>
              <select id="type" name="type">
                <option value="expense">支出</option>
                <option value="income">収入</option>
              </select>
            </div>

            <div class="field">
              <label for="amount">金額</label>
              <input type="number" id="amount" name="amount" min="0" placeholder="0" />
            </div>

            <button class="submit-btn" type="submit">追加</button>
          </form>
        </section>

        <section class="panel">
          <h2>登録一覧</h2>
          <div class="summary">
            <span>合計金額</span>
            <strong>248,500円</strong>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>日付</th>
                  <th>品目</th>
                  <th>分類</th>
                  <th>金額</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>2026-08-01</td>
                  <td>食費</td>
                  <td>支出</td>
                  <td>1,500円</td>
                </tr>
                <tr>
                  <td>2026-08-02</td>
                  <td>給料</td>
                  <td>収入</td>
                  <td>250,000円</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
